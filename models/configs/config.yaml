defaults:
  - _self_
data:
  base_dir: .
  #base_dir: /app/api
  data_dir: ${data.base_dir}/models/data
  tokenizer_dir: ${data.base_dir}/tokenizer/vocabs
  model_dir: ${data.base_dir}/checkpoints
  model_weights: ${data.model_dir}/transformer_00.pt
  log_dir: ${data.base_dir}/logs
training:
  batch_size: 256
  num_epochs: 30
  lr: 0.0003
  dropout: 0.1
  seq_len: 100
  validation_interval_steps: 10000
  validation_samples: 10000
  use_pretrained_decoder: false
  mixed_precision: bf16
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  checkpoint_interval_steps: 10000
  num_workers: 4
model:
  d_model: 512
  num_heads: 8
  num_layers: 6
  d_ff: 2048
language:
  src_lang: ru
  tgt_lang: en
dataset:
  name: wmt19
  config_name: ru-en
  train_split: train
  validation_split: validation
vocabs:
  ru_token_to_id: ${data.tokenizer_dir}/ru-vocab/ru_token_to_id.json
  ru_id_to_token: ${data.tokenizer_dir}/ru-vocab/ru_id_to_token.json
  en_token_to_id: ${data.tokenizer_dir}/en-vocab/en_token_to_id.json
  en_id_to_token: ${data.tokenizer_dir}/en-vocab/en_id_to_token.json
logging:
  model_basename: transformer_
  preload: latest
  experiment_name: ru-en-transformer
  log_interval: 50
  example_interval: 1
  log_examples: True
  log_examples_every_checkpoint: True
  #run_id: "5lo4muld"
  #resume: must
hydra:
  run:
    dir: ${data.base_dir}/outputs