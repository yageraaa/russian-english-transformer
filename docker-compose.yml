services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gera
      POSTGRES_PASSWORD: gera123
      POSTGRES_DB: translator_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gera -d translator_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: api/backend/Dockerfile
    env_file:
      - ./api/.env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./api:/app/api
      - ./models:/app/api/models
      - ./checkpoints:/app/api/checkpoints
      - ./tokenizer:/app/api/tokenizer
      - ./logs:/app/api/logs
      - ./outputs:/app/api/outputs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: api/frontend/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_URL=http://backend:8000
    volumes:
      - ./api:/app/api
    command: >
      streamlit run api/frontend/app.py --server.port 8501 --server.address=0.0.0.0
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge