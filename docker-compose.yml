services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gera
      POSTGRES_PASSWORD: gera123
      POSTGRES_DB: translator_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gera -d translator_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  backend:
    build:
      context: ./api/backend
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./api/.env:/app/api/.env
      - ./models:/app/models
      - ./tokenizer:/app/tokenizer
    networks:
      - app-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  frontend:
    build:
      context: ./api/frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./api/.env:/app/api/.env
    networks:
      - app-network
volumes:
  postgres_data:
  minio_data:
networks:
  app-network:
    driver: bridge